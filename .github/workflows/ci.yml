name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6

      # check to ensure all JSON files are valid in the repository
      - name: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@9dbc6e6ff950c53200156e8afbc16ef1355f1c8d # pin@v5.0.1
        with:
          comment: "true"
          exclude_file: .github/exclude.txt

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # pin@v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: env setup
        env:
          PUBLIC_URL: ''
        run: |
          touch .env
          echo PUBLIC_URL=$PUBLIC_URL >> .env

      - name: Get files needed
        run: pnpm run prebuild
        env:
          GITHUB_TOKEN: ${{ secrets.HIDEOUT_BOT_TOKEN }}

      - name: test
        run: pnpm run test
